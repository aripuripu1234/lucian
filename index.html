<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science & Storage Account Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .card { background-color: #161e2e; border: 1px solid #243044; color: #f8fafc; border-radius: 10px; }
        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 6px; max-height: 320px; overflow-y: auto; padding: 4px; }
        .tile-box { padding: 6px 2px; text-align: center; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .bg-ready { background-color: #15803d; color: #ffffff; border: 1px solid #22c55e; }
        .bg-cd { background-color: #1e293b; color: #f59e0b; border: 1px solid #d97706; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="p-3 p-md-4">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-warning font-monospace">🧪 Science Account Power Controller</h3>
            <span class="badge bg-outline-light border">Max Cooldown: 12 Jam</span>
        </div>
        
        <!-- ROW 1: Storage Config & Remote Account Power -->
        <div class="row g-3 mb-4">
            <div class="col-lg-4">
                <div class="card p-3 mb-3 border-info">
                    <h5 class="text-info">📦 Input Config Storage World</h5>
                    <form id="storageForm" class="mt-2">
                        <div class="mb-2">
                            <label class="form-label small">Nama Storage World</label>
                            <input type="text" id="storageWorld" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="STORAGEKU01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">ID Door Storage</label>
                            <input type="text" id="storageDoor" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="MAIN">
                        </div>
                        <button type="submit" class="btn btn-info btn-sm w-100 fw-bold">Update Storage World</button>
                    </form>
                </div>

                <div class="card p-3">
                    <h5 class="text-warning">🌾 Tambah Farm World</h5>
                    <form id="addWorldForm" class="mt-2">
                        <div class="mb-2">
                            <label class="form-label small">Nama Farm World</label>
                            <input type="text" id="worldName" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="COBATAKA05" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">ID Door World</label>
                            <input type="text" id="doorId" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="KW33">
                        </div>
                        <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Daftarkan Farm World</button>
                    </form>
                </div>
            </div>

            <!-- Monitoring & Tombol Saklar Connect/Disconnect Game -->
            <div class="col-lg-8">
                <div class="card p-3 h-100">
                    <h5 class="text-info">Kontrol Saklar Akun (Online / Offline Game)</h5>
                    <div class="table-responsive mt-2">
                        <table class="table table-dark table-hover small" id="botTable">
                            <thead>
                                <tr>
                                    <th>Username Akun</th>
                                    <th>World Aktif</th>
                                    <th>Status In-Game</th>
                                    <th>Saklar Web</th>
                                    <th>Aksi Kontrol</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROW 2: Grid Detail Tile & Status Cooldown -->
        <div class="row g-3">
            <div class="col-12">
                <div class="card p-3">
                    <h5 class="text-info mb-3">Detail Koordinat Tile & Estimasi Cooldown</h5>
                    <div id="worldCards" class="row g-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_URL = "https://luci-44c7f-default-rtdb.asia-southeast1.firebasedatabase.app";

        async function loadStorageConfig() {
            try {
                const res = await fetch(`${DB_URL}/config/storage.json`);
                const data = await res.json();
                if (data) {
                    document.getElementById("storageWorld").value = data.world || "";
                    document.getElementById("storageDoor").value = data.door || "";
                }
            } catch(e) {}
        }

        document.getElementById("storageForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const configData = {
                world: document.getElementById("storageWorld").value.toUpperCase(),
                door: document.getElementById("storageDoor").value
            };

            await fetch(`${DB_URL}/config/storage.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(configData)
            });
            alert("Storage World Berhasil Diperbarui!");
        });

        // Mengganti Status Saklar Akun (Online / Offline)
        async function toggleAccountPower(botName, currentControl) {
            const nextControl = (currentControl === "ONLINE") ? "OFFLINE" : "ONLINE";
            await fetch(`${DB_URL}/bots/${botName}/control.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nextControl)
            });
            loadBots();
        }

        async function loadBots() {
            try {
                const res = await fetch(`${DB_URL}/bots.json`);
                const data = await res.json();
                const tbody = document.querySelector("#botTable tbody");
                tbody.innerHTML = "";
                
                if (!data) return;
                const now = Math.floor(Date.now() / 1000);

                for (let name in data) {
                    const bot = data[name];
                    const isScriptRunning = (now - bot.last_active) < 60;
                    const controlState = bot.control || "ONLINE";

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold text-warning">${bot.name}</td>
                            <td><span class="badge bg-secondary">${bot.current_world || '-'}</span></td>
                            <td>
                                <span class="status-dot ${isScriptRunning && bot.status.includes('Online') ? 'bg-success' : 'bg-danger'}"></span>
                                ${bot.status || 'Offline'}
                            </td>
                            <td>
                                <span class="badge ${controlState === 'ONLINE' ? 'bg-success' : 'bg-danger'}">${controlState}</span>
                            </td>
                            <td>
                                <button onclick="toggleAccountPower('${bot.name}', '${controlState}')" class="btn ${controlState === 'ONLINE' ? 'btn-danger' : 'btn-success'} btn-sm py-0 fw-bold">
                                    ${controlState === 'ONLINE' ? 'OFFLINE-KAN AKUN' : 'ONLINE-KAN AKUN'}
                                </button>
                            </td>
                        </tr>
                    `;
                }
            } catch(e) {}
        }

        async function loadWorlds() {
            try {
                const res = await fetch(`${DB_URL}/worlds.json`);
                const data = await res.json();
                const container = document.querySelector("#worldCards");
                container.innerHTML = "";

                if (!data) return;
                const now = Math.floor(Date.now() / 1000);

                for (let worldName in data) {
                    const world = data[worldName];
                    const summary = world.summary || { total_ss: 0, ready: 0, cooldown: 0, door_id: "-", last_bot: "-" };
                    const tiles = world.tiles || {};
                    
                    let tileHtml = "";
                    let readyCalculated = 0;
                    let cooldownCalculated = 0;

                    for (let tKey in tiles) {
                        const tile = tiles[tKey];
                        const isReady = now >= (tile.next_harvest || 0);
                        
                        if (isReady) {
                            readyCalculated++;
                            tileHtml += `
                                <div class="tile-box bg-ready" title="Tile (${tile.x}, ${tile.y}) - READY">
                                    (${tile.x},${tile.y})<br>READY
                                </div>`;
                        } else {
                            cooldownCalculated++;
                            const remainingSec = tile.next_harvest - now;
                            const hoursLeft = Math.floor(remainingSec / 3600);
                            const minsLeft = Math.floor((remainingSec % 3600) / 60);
                            tileHtml += `
                                <div class="tile-box bg-cd" title="Tile (${tile.x}, ${tile.y}) - Belum Dipanen">
                                    (${tile.x},${tile.y})<br>${hoursLeft}j ${minsLeft}m
                                </div>`;
                        }
                    }

                    container.innerHTML += `
                        <div class="col-xl-6">
                            <div class="card p-3 border-secondary">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h4 class="text-warning font-monospace m-0">${worldName}</h4>
                                    <span class="badge bg-primary">Door: ${summary.door_id}</span>
                                </div>
                                <small class="text-muted mt-1">Bot Pengelola: <b class="text-info">${summary.last_bot}</b></small>
                                <hr class="border-secondary my-2">
                                
                                <div class="row text-center mb-3">
                                    <div class="col"><b>Total SS</b><br>${summary.total_ss}</div>
                                    <div class="col text-success"><b>Siap Panen</b><br>${readyCalculated}</div>
                                    <div class="col text-warning"><b>Cooldown</b><br>${cooldownCalculated}</div>
                                </div>

                                <h6 class="small text-muted mb-1">Grid Tile & Status Cooldown (Koordinat X,Y):</h6>
                                <div class="tile-grid">${tileHtml || '<small class="text-muted">Belum ada data tile ter-scan</small>'}</div>
                            </div>
                        </div>
                    `;
                }
            } catch(e) {}
        }

        document.getElementById("addWorldForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("worldName").value.toUpperCase();
            const door = document.getElementById("doorId").value;

            await fetch(`${DB_URL}/worlds/${name}/summary.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ door_id: door, last_bot: "-", total_ss: 0, ready: 0, cooldown: 0 })
            });

            document.getElementById("addWorldForm").reset();
            loadWorlds();
        });

        setInterval(() => {
            loadBots();
            loadWorlds();
        }, 5000);

        loadStorageConfig();
        loadBots();
        loadWorlds();
    </script>
</body>
</html>
