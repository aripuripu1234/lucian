<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCIFER // CONTROL</title>
<style>
  :root{
    --bg: #060907;
    --panel: #0e130e;
    --panel-2: #131a12;
    --line: #223122;
    --green: #9FEF00;
    --green-dim: #5c8a12;
    --amber: #FF9F1C;
    --red: #FF4136;
    --text: #E9F2E1;
    --muted: #7C8B74;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(159,239,0,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,65,54,0.04), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(159,239,0,0.03), transparent);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-mark{
    width:34px; height:34px;
    border-radius:50%;
    border: 2px solid var(--green);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .brand-mark::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 12px 2px rgba(159,239,0,0.6);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform: scale(1); }
    50%{ opacity:.55; transform: scale(0.82); }
  }

  .brand h1{
    margin:0;
    font-size: 17px;
    letter-spacing: 0.14em;
    font-weight: 700;
  }
  .brand p{
    margin:2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .fb-status{
    display:flex; align-items:center; gap:8px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--muted);
    flex-shrink:0;
  }
  .dot.live{ background: var(--green); box-shadow: 0 0 8px 1px rgba(159,239,0,.7); }
  .dot.down{ background: var(--red); box-shadow: 0 0 8px 1px rgba(255,65,54,.7); }

  /* ---------- Main ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .section-head h2{
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
    margin:0;
  }
  .count-pill{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--green);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .empty{
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 48px 24px;
    text-align:center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
  }

  .card{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    position: relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:2px;
    background: var(--muted);
  }
  .card.online::before{ background: var(--green); }
  .card.offline::before{ background: var(--red); }

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .bot-name{
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
  }
  .status-tag{
    display:flex; align-items:center; gap:6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .status-tag.online{ color: var(--green); }
  .status-tag.offline{ color: var(--red); }

  .readout{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    display:flex;
    flex-direction:column;
    gap: 5px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .readout .row{ display:flex; justify-content:space-between; gap:10px; }
  .readout .row span:first-child{ color: #566152; }
  .readout .row span:last-child{ color: var(--text); text-align:right; }
  .readout .row.hunting span:last-child{ color: var(--amber); }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size: 12.5px;
    color: var(--muted);
  }
  .switch{
    position:relative;
    width: 38px; height: 20px;
    border-radius: 999px;
    background: #1c261a;
    border: 1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:14px; height:14px;
    border-radius:50%;
    background: var(--muted);
    transition: transform .15s ease, background .15s ease;
  }
  .switch.on{ border-color: var(--green-dim); background: rgba(159,239,0,0.12); }
  .switch.on::after{ background: var(--green); transform: translateX(18px); }

  .btn-row{
    display:flex;
    gap: 8px;
  }
  button{
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 9px 10px;
    cursor:pointer;
    transition: filter .12s ease, transform .05s ease;
    flex:1;
  }
  button:hover{ filter: brightness(1.25); }
  button:active{ transform: scale(0.98); }

  .btn-connect{ border-color: var(--green-dim); color: var(--green); }
  .btn-disconnect{ border-color: rgba(255,65,54,0.4); color: var(--red); }
  .btn-geiger{
    flex: none;
    width: 42px;
    display:flex; align-items:center; justify-content:center;
    border-color: var(--amber);
    color: var(--amber);
    font-size: 17px;
    padding: 0;
  }
  .btn-geiger.active{
    background: rgba(255,159,28,0.15);
    box-shadow: 0 0 10px rgba(255,159,28,0.35);
  }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(2,4,2,0.72);
    backdrop-filter: blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.show{ display:flex; }

  .modal{
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
  }
  .modal h3{
    margin:0 0 4px;
    font-size: 15px;
    display:flex; align-items:center; gap:8px;
  }
  .modal p.sub{
    margin: 0 0 18px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: var(--mono);
  }
  .field input{
    width:100%;
    background: #0b100a;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 11px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
  }
  .field input:focus{
    outline:none;
    border-color: var(--green-dim);
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top: 6px;
  }
  .btn-cancel{ color: var(--muted); }
  .btn-start{
    border-color: var(--green-dim);
    color: var(--green);
  }

  .toast{
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-family: var(--mono);
    font-size: 12.5px;
    opacity:0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index: 60;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1>LUCIFER CONTROL</h1>
      <p>multibot dashboard</p>
    </div>
  </div>
  <div class="fb-status" id="fbStatus">
    <span class="dot" id="fbDot"></span>
    <span id="fbLabel">connecting…</span>
  </div>
</div>

<main>
  <div class="section-head">
    <h2>AKUN TERHUBUNG</h2>
    <span class="count-pill" id="countPill">0 bot</span>
  </div>

  <div id="botGrid" class="grid"></div>
  <div id="emptyState" class="empty">
    Belum ada akun yang terhubung.<br>
    Jalankan script Lua di Lucifer supaya bot muncul di sini secara otomatis.
  </div>
</main>

<!-- Modal Geiger -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>☢ Mulai Geiger Hunt</h3>
    <p class="sub" id="modalTarget">bot: -</p>

    <div class="field">
      <label>World Geiger (ambil geiger)</label>
      <input type="text" id="inputWorldGeiger" placeholder="worldgeiger" autocomplete="off">
    </div>
    <div class="field">
      <label>World Hunt (cari sinyal)</label>
      <input type="text" id="inputWorldHunt" placeholder="worldg" autocomplete="off">
    </div>
    <div class="field">
      <label>World Storage (drop hasil)</label>
      <input type="text" id="inputWorldStorage" placeholder="worldstorage" autocomplete="off">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Batal</button>
      <button class="btn-start" id="btnStart">Mulai Berburu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB_URL = "https://luci-44c7f-default-rtdb.asia-southeast1.firebasedatabase.app";
const BOTS_PATH = "/bots";

let bots = {};       // local mirror of /bots
let activeKey = null; // bot targeted by the geiger modal

const grid = document.getElementById('botGrid');
const emptyState = document.getElementById('emptyState');
const countPill = document.getElementById('countPill');
const fbDot = document.getElementById('fbDot');
const fbLabel = document.getElementById('fbLabel');
const overlay = document.getElementById('overlay');
const modalTarget = document.getElementById('modalTarget');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove('show'), 2400);
}

function setDeep(obj, path, value){
  // path like "/botkey/field" or "/" or "/botkey"
  const parts = path.split('/').filter(Boolean);
  if(parts.length === 0){
    return value === null ? {} : value;
  }
  let cursor = obj;
  for(let i=0;i<parts.length-1;i++){
    const p = parts[i];
    if(typeof cursor[p] !== 'object' || cursor[p] === null) cursor[p] = {};
    cursor = cursor[p];
  }
  const last = parts[parts.length-1];
  if(value === null){
    delete cursor[last];
  } else {
    cursor[last] = value;
  }
  return obj;
}

function connectStream(){
  fbLabel.textContent = 'connecting…';
  fbDot.className = 'dot';

  const es = new EventSource(`${DB_URL}${BOTS_PATH}.json`);

  es.addEventListener('put', (e) => {
    const { path, data } = JSON.parse(e.data);
    bots = setDeep(bots, path, data === null ? null : data) || {};
    if(path === '/') bots = data || {};
    render();
    fbDot.className = 'dot live';
    fbLabel.textContent = 'terhubung';
  });

  es.addEventListener('patch', (e) => {
    const { path, data } = JSON.parse(e.data);
    if(path === '/'){
      Object.assign(bots, data);
    } else {
      setDeep(bots, path, data);
    }
    render();
  });

  es.onerror = () => {
    fbDot.className = 'dot down';
    fbLabel.textContent = 'terputus, reconnecting…';
  };
}

function isOnline(bot){
  return (bot && bot.status === 'online');
}

function render(){
  const keys = Object.keys(bots || {});
  countPill.textContent = `${keys.length} bot`;
  emptyState.style.display = keys.length === 0 ? 'block' : 'none';
  grid.style.display = keys.length === 0 ? 'none' : 'grid';

  grid.innerHTML = '';
  keys.sort().forEach(key => {
    grid.appendChild(renderCard(key, bots[key] || {}));
  });
}

function renderCard(key, bot){
  const online = isOnline(bot);
  const autoCollect = !!bot.auto_collect;
  const geigerActive = !!bot.geiger_active;
  const world = bot.world || '-';
  const x = (bot.x !== undefined) ? bot.x : '-';
  const y = (bot.y !== undefined) ? bot.y : '-';

  const card = document.createElement('div');
  card.className = `card ${online ? 'online' : 'offline'}`;

  card.innerHTML = `
    <div class="card-head">
      <div class="bot-name">${escapeHtml(key)}</div>
      <div class="status-tag ${online ? 'online' : 'offline'}">
        <span class="dot ${online ? 'live' : 'down'}"></span>
        ${online ? 'ONLINE' : 'OFFLINE'}
      </div>
    </div>

    <div class="readout">
      <div class="row"><span>world</span><span>${escapeHtml(world)}</span></div>
      <div class="row"><span>posisi</span><span>${x} , ${y}</span></div>
      <div class="row ${geigerActive ? 'hunting' : ''}"><span>geiger</span><span>${geigerActive ? 'BERBURU…' : 'idle'}</span></div>
    </div>

    <div class="toggle-row">
      <span>Auto Collect</span>
      <div class="switch ${autoCollect ? 'on' : ''}" data-action="toggle_autocollect" data-key="${key}"></div>
    </div>

    <div class="btn-row">
      ${online
        ? `<button class="btn-disconnect" data-action="disconnect" data-key="${key}">Disconnect</button>`
        : `<button class="btn-connect" data-action="connect" data-key="${key}">Connect</button>`
      }
      <button class="btn-geiger ${geigerActive ? 'active' : ''}" data-action="open_geiger" data-key="${key}" title="Geiger Hunt">☢</button>
    </div>
  `;
  return card;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function sendCommand(key, payload){
  try{
    await fetch(`${DB_URL}${BOTS_PATH}/${encodeURIComponent(key)}/command.json`, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });
  }catch(err){
    showToast('Gagal mengirim perintah ke Firebase');
  }
}

grid.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const key = el.dataset.key;

  if(action === 'connect'){
    sendCommand(key, { action: 'connect' });
    showToast(`Mengirim perintah connect ke ${key}`);
  }
  else if(action === 'disconnect'){
    sendCommand(key, { action: 'disconnect' });
    showToast(`Mengirim perintah disconnect ke ${key}`);
  }
  else if(action === 'toggle_autocollect'){
    const current = !!(bots[key] && bots[key].auto_collect);
    el.classList.toggle('on', !current); // optimistic UI
    sendCommand(key, { action: current ? 'disable_auto_collect' : 'enable_auto_collect' });
  }
  else if(action === 'open_geiger'){
    openGeigerModal(key);
  }
});

function openGeigerModal(key){
  activeKey = key;
  modalTarget.textContent = `bot: ${key}`;
  const bot = bots[key] || {};
  document.getElementById('inputWorldGeiger').value = bot.last_world_geiger || '';
  document.getElementById('inputWorldHunt').value = bot.last_world_hunt || '';
  document.getElementById('inputWorldStorage').value = bot.last_world_storage || '';
  overlay.classList.add('show');
}

document.getElementById('btnCancel').addEventListener('click', () => {
  overlay.classList.remove('show');
});
overlay.addEventListener('click', (e) => {
  if(e.target === overlay) overlay.classList.remove('show');
});

document.getElementById('btnStart').addEventListener('click', () => {
  const world_geiger = document.getElementById('inputWorldGeiger').value.trim();
  const world_hunt = document.getElementById('inputWorldHunt').value.trim();
  const world_storage = document.getElementById('inputWorldStorage').value.trim();

  if(!world_geiger || !world_hunt || !world_storage){
    showToast('Semua field world wajib diisi');
    return;
  }
  if(!activeKey) return;

  sendCommand(activeKey, {
    action: 'start_geiger',
    world_geiger, world_hunt, world_storage
  });
  showToast(`Perintah geiger hunt dikirim ke ${activeKey}`);
  overlay.classList.remove('show');
});

connectStream();
</script>

</body>
</html>
