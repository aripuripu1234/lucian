<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Station Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070a10;
            --panel: #10161f;
            --panel-alt: #131b26;
            --border: #1e2836;
            --border-bright: #2a3a4d;
            --cyan: #5eead4;
            --cyan-dim: rgba(94, 234, 212, 0.12);
            --amber: #fbbf24;
            --green: #34d399;
            --red: #fb7185;
            --text: #e6edf3;
            --muted: #5b6b7f;

            --chem-914: #34d399;
            --chem-916: #fb7185;
            --chem-918: #fbbf24;
            --chem-920: #60a5fa;
            --chem-924: #c084fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            padding: 28px 20px 60px;
            background-image:
                linear-gradient(rgba(94,234,212,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(94,234,212,0.035) 1px, transparent 1px);
            background-size: 36px 36px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--cyan);
            border-radius: 4px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .live-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green), 0 0 2px var(--green);
            animation: pulse-dot 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        h1 {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text);
        }

        h1 span { color: var(--cyan); }

        #last-update {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* CARD SHELL */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 22px;
            margin-bottom: 20px;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, var(--cyan), transparent 60%);
            opacity: 0.5;
        }

        .card-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title::before {
            content: "// ";
            color: var(--cyan);
        }

        /* STORAGE READOUT SECTION */
        .storage-header {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 20px;
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .storage-header b { color: var(--cyan); font-weight: 600; }
        .storage-header .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.68rem; margin-right: 6px; }

        .readout-layout {
            display: flex;
            gap: 24px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        /* Reactor-style total readout */
        .reactor {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, var(--cyan-dim), transparent 70%);
        }

        .reactor::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--border-bright);
        }

        .reactor::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px dashed rgba(94, 234, 212, 0.25);
            animation: spin 14s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .reactor-inner {
            text-align: center;
            z-index: 1;
        }

        .stat-box.highlight .stat-label {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-box.highlight #total-chem {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--cyan);
            text-shadow: 0 0 18px rgba(94, 234, 212, 0.45);
        }

        .stats-grid {
            flex: 1;
            min-width: 260px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .stat-box {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-left: 3px solid var(--chem-color, var(--cyan));
            border-radius: 4px;
            padding: 14px 16px;
        }

        .stat-box:nth-of-type(2) { --chem-color: var(--chem-914); }
        .stat-box:nth-of-type(3) { --chem-color: var(--chem-916); }
        .stat-box:nth-of-type(4) { --chem-color: var(--chem-918); }
        .stat-box:nth-of-type(5) { --chem-color: var(--chem-920); }
        .stat-box:nth-of-type(6) { --chem-color: var(--chem-924); }

        .stat-box:not(.highlight) .stat-label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 6px;
        }

        .stat-box:not(.highlight) .stat-value {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* BOT TABLE */
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }

        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 12px 12px;
            border-bottom: 1px solid var(--border-bright);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        tbody tr { transition: background 0.15s ease; }
        tbody tr:hover { background: rgba(94, 234, 212, 0.04); }
        tbody tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border: 1px solid transparent;
        }

        .badge::before {
            content: "";
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .badge-online {
            background: rgba(52, 211, 153, 0.1);
            color: var(--green);
            border-color: rgba(52, 211, 153, 0.3);
        }
        .badge-online::before {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .badge-offline {
            background: rgba(251, 113, 133, 0.1);
            color: var(--red);
            border-color: rgba(251, 113, 133, 0.3);
        }
        .badge-offline::before { background: var(--red); }

        @media (max-width: 640px) {
            .readout-layout { flex-direction: column; align-items: center; }
            .reactor { margin: 0 auto; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tbody tr {
                border: 1px solid var(--border);
                border-radius: 4px;
                margin-bottom: 10px;
                padding: 8px 4px;
            }
            td {
                border-bottom: none;
                display: flex;
                justify-content: space-between;
                padding: 6px 12px;
            }
            td:first-child { font-weight: 600; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <span class="live-dot"></span>
            <h1>Science Station <span>// Control</span></h1>
        </div>
        <div id="last-update">Memuat data...</div>
    </header>

    <!-- STORAGE GROWSCAN STATS -->
    <div class="card">
        <div class="card-title">
            <span>Hasil GrowScan Storage World</span>
            <span id="storage-world-tag" class="badge badge-online">-</span>
        </div>
        <div class="storage-header">
            <span><span class="lbl">Dipindai Terakhir Oleh</span><b id="scan-bot">-</b></span>
            <span><span class="lbl">Waktu</span><b id="scan-time">-</b></span>
        </div>

        <div class="readout-layout">
            <div class="reactor">
                <div class="stat-box highlight reactor-inner">
                    <div class="stat-label">TOTAL CHEMICAL</div>
                    <div class="stat-value" id="total-chem">0</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Chemical G (914)</div>
                    <div class="stat-value" id="chem-914">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Chemical R (916)</div>
                    <div class="stat-value" id="chem-916">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Chemical Y (918)</div>
                    <div class="stat-value" id="chem-918">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Chemical B (920)</div>
                    <div class="stat-value" id="chem-920">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Chemical P (924)</div>
                    <div class="stat-value" id="chem-924">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOT STATUS TABLE -->
    <div class="card">
        <div class="card-title">Status Bot</div>
        <table>
            <thead>
                <tr>
                    <th>Nama Bot</th>
                    <th>Status</th>
                    <th>World Saat Ini</th>
                    <th>Terakhir Aktif</th>
                </tr>
            </thead>
            <tbody id="bot-table-body">
                <tr><td colspan="4">Memuat data bot...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://luci-44c7f-default-rtdb.asia-southeast1.firebasedatabase.app";

    function formatTime(timestamp) {
        if (!timestamp || timestamp === 0) return "-";
        const date = new Date(timestamp * 1000);
        return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function fetchStorageStats() {
        try {
            const res = await fetch(`${FIREBASE_URL}/storage_stats.json`);
            const data = await res.json();
            
            if (data) {
                document.getElementById('storage-world-tag').textContent = data.world || "UNSET";
                document.getElementById('scan-bot').textContent = data.last_scanned_by || "-";
                document.getElementById('scan-time').textContent = formatTime(data.updated_at);
                
                document.getElementById('total-chem').textContent = (data.total || 0).toLocaleString();
                document.getElementById('chem-914').textContent = (data.chem_914 || 0).toLocaleString();
                document.getElementById('chem-916').textContent = (data.chem_916 || 0).toLocaleString();
                document.getElementById('chem-918').textContent = (data.chem_918 || 0).toLocaleString();
                document.getElementById('chem-920').textContent = (data.chem_920 || 0).toLocaleString();
                document.getElementById('chem-924').textContent = (data.chem_924 || 0).toLocaleString();
            }
        } catch (err) {
            console.error("Gagal mengambil data storage stats:", err);
        }
    }

    async function fetchBotStatus() {
        try {
            const res = await fetch(`${FIREBASE_URL}/bots.json`);
            const data = await res.json();
            const tbody = document.getElementById('bot-table-body');
            tbody.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(botKey => {
                    const bot = data[botKey];
                    const isOnline = bot.status && bot.status.includes("Online");
                    const statusClass = isOnline ? "badge-online" : "badge-offline";
                    
                    const row = `
                        <tr>
                            <td><b>${bot.name || botKey}</b></td>
                            <td><span class="badge ${statusClass}">${bot.status || "Offline"}</span></td>
                            <td>${bot.current_world || "-"}</td>
                            <td>${formatTime(bot.last_active)}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4">Tidak ada bot terdaftar.</td></tr>';
            }
        } catch (err) {
            console.error("Gagal mengambil data bot:", err);
        }
    }

    function refreshDashboard() {
        fetchStorageStats();
        fetchBotStatus();
        document.getElementById('last-update').textContent = `Update: ${new Date().toLocaleTimeString()}`;
    }

    // Refresh otomatis setiap 5 detik
    setInterval(refreshDashboard, 5000);
    refreshDashboard();
</script>

</body>
</html>
