<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Room — Science Controller</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Stats Strip */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
            margin-top: 6px;
        }

        /* Main Section Grid */
        .section-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
        }

        @media (max-width: 960px) {
            .section-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* World Cards & Status */
        .world-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .world-card:hover {
            border-color: var(--accent);
        }

        .world-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .world-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge-success {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-secondary {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
        }

        .world-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .world-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .world-stat-item {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .world-stat-item div {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* Tile Status Visualizer */
        .tile-container {
            margin-top: 10px;
        }

        .tile-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .tile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .tile {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tile:hover {
            transform: scale(1.2);
        }

        .tile-harvested {
            background: var(--success);
            color: #000;
        }

        .tile-cooldown {
            background: var(--warning);
            color: #000;
        }

        .tile-ready {
            background: var(--accent);
            color: #000;
        }

        /* Bot Roster Item */
        .bot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .bot-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bot-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .bot-world {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 Signal Room — Science Controller</h1>
        <div class="header-status">
            <span style="height: 8px; width: 8px; background-color: var(--success); border-radius: 50%; display: inline-block;"></span>
            <span id="connection-status">Connected to Database</span>
        </div>
    </header>

    <!-- Global Stat Strip -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Total Science Station</div>
            <div class="value" id="stat-total-ss">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Sudah Dipanen (Punched)</div>
            <div class="value" style="color: var(--success);" id="stat-harvested">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Dalam Cooldown</div>
            <div class="value" style="color: var(--warning);" id="stat-cooldown">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Status Re-Check Sistem</div>
            <div class="value" id="stat-recheck-status" style="font-size: 1.1rem; color: var(--accent);">Standby</div>
        </div>
    </div>

    <div class="section-grid">
        <!-- Left Panel: Configurations & Bot List -->
        <div class="left-column">
            <!-- Global Config -->
            <div class="panel">
                <h2>Konfigurasi Global</h2>
                <div class="form-group">
                    <label for="config-storage">Storage World & Door</label>
                    <input type="text" id="config-storage" placeholder="NAMAWORLD|DOORID">
                </div>
                <div class="form-group">
                    <label for="config-mode">Mode Operasi Bot</label>
                    <select id="config-mode">
                        <option value="HARVEST">HARVEST (Panen & Punch)</option>
                        <option value="SCAN_ONLY">SCAN ONLY (Monitoring)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="config-disconnect">Auto Disconnect saat Cooldown</label>
                    <select id="config-disconnect">
                        <option value="ENABLE">Aktif (Hemat Resource)</option>
                        <option value="DISABLE">Nonaktif (Tetap Online)</option>
                    </select>
                </div>
                <button class="btn" onclick="saveConfig()">Simpan Konfigurasi</button>
            </div>

            <!-- Add New Farm World -->
            <div class="panel">
                <h2>Tambah World Farm</h2>
                <div class="form-group">
                    <label for="input-world-name">Nama World</label>
                    <input type="text" id="input-world-name" placeholder="CONTOHWORLD">
                </div>
                <div class="form-group">
                    <label for="input-world-door">Door ID (Optional)</label>
                    <input type="text" id="input-world-door" placeholder="MAIN">
                </div>
                <button class="btn" onclick="addWorld()">Tambah World</button>
            </div>

            <!-- Bot Roster -->
            <div class="panel">
                <h2>Roster Bot Connected</h2>
                <div id="bot-list">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Memuat data bot...</div>
                </div>
            </div>
        </div>

        <!-- Right Panel: World Farm Status & Timers -->
        <div class="right-column">
            <div class="panel">
                <h2>
                    <span>Daftar Farm World & Status Panen</span>
                    <button class="btn btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="resetAllData()">Reset Semua Data</button>
                </h2>
                <div id="world-list">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Memuat daftar world...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://luci-44c7f-default-rtdb.asia-southeast1.firebasedatabase.app";

    document.addEventListener("DOMContentLoaded", () => {
        loadConfig();
        loadBots();
        loadWorlds();

        // Polling Realtime tiap 3 Detik
        setInterval(() => {
            loadBots();
            loadWorlds();
        }, 3000);
    });

    // --- 1. MEMUAT & MENYIMPAN KONFIGURASI GLOBAL ---
    async function loadConfig() {
        try {
            const res = await fetch(`${DB_URL}/config.json`);
            const data = await res.json();
            if (data) {
                if (data.storage) document.getElementById("config-storage").value = data.storage;
                if (data.mode) document.getElementById("config-mode").value = data.mode;
                if (data.auto_disconnect) document.getElementById("config-disconnect").value = data.auto_disconnect;
            }
        } catch (e) {
            console.error("Gagal memuat konfigurasi", e);
        }
    }

    async function saveConfig() {
        const storage = document.getElementById("config-storage").value.trim();
        const mode = document.getElementById("config-mode").value;
        const auto_disconnect = document.getElementById("config-disconnect").value;

        await fetch(`${DB_URL}/config.json`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ storage, mode, auto_disconnect })
        });
        alert("Konfigurasi global berhasil diperbarui!");
    }

    // --- 2. MANAJEMEN ROSTER BOT ---
    async function loadBots() {
        try {
            const res = await fetch(`${DB_URL}/bots.json`);
            const data = await res.json() || {};
            const container = document.getElementById("bot-list");
            container.innerHTML = "";

            const now = Math.floor(Date.now() / 1000);
            const botKeys = Object.keys(data);

            if (botKeys.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem;">Tidak ada bot aktif saat ini.</div>`;
                return;
            }

            for (const botId of botKeys) {
                const bot = data[botId];

                // Auto-cleanup bot yang inactivity > 10 Menit (600 detik)
                if (bot.last_active && (now - bot.last_active > 600)) {
                    await fetch(`${DB_URL}/bots/${botId}.json`, { method: "DELETE" });
                    continue;
                }

                const isOnline = bot.status === "ONLINE";

                container.innerHTML += `
                    <div class="bot-item">
                        <div class="bot-info">
                            <span class="bot-name">${botId}</span>
                            <span class="bot-world">World: ${bot.world || 'Unknown'} | Door: ${bot.door || '-'}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="badge ${isOnline ? 'badge-success' : 'badge-warning'}">${bot.status || 'OFFLINE'}</span>
                            <button class="delete-btn" title="Hapus Bot" onclick="deleteBot('${botId}')">✕</button>
                        </div>
                    </div>
                `;
            }
        } catch (e) {
            console.error("Gagal memuat bot list", e);
        }
    }

    async function deleteBot(botId) {
        if (confirm(`Hapus bot ${botId} dari daftar?`)) {
            await fetch(`${DB_URL}/bots/${botId}.json`, { method: "DELETE" });
            loadBots();
        }
    }

    // --- 3. LOGIKA HARVEST & RE-CHECK ADAPTIF 1 JAM ---
    /**
     * Dipanggil saat Bot/Simulasi melakukan scan/punch di World.
     * Mengatur pemisahan status "Sudah Dipanen" (Punched) vs "Cooldown",
     * serta memperbarui waktu selesai panen secara adaptif.
     */
    async function processHarvestLogic(worldName, tiles, currentWorldData = {}) {
        const now = Date.now();
        
        let totalReadyCount = 0;
        let harvestedCount = 0;
        let cooldownCount = 0;

        // 1. Klasifikasi Status Tile
        tiles.forEach(tile => {
            if (tile.isPunched) {
                harvestedCount++; // Masuk ke Sudah Dipanen
            } else if (tile.isReady) {
                totalReadyCount++;
            } else {
                cooldownCount++; // Masuk ke Cooldown
            }
        });

        // 2. Evaluasi Adaptif Waktu Selesai Panen (Finish Time)
        let updatedFinishTime = currentWorldData.finish_time || null;
        let isNewHarvestExecuted = harvestedCount > 0;

        if (isNewHarvestExecuted) {
            // Ada yang baru dipanen -> Pakai timestamp panen terbaru
            updatedFinishTime = now;
        } else {
            // TIDAK ADA yang berhasil dipanen (tetap cooldown):
            // Pertahankan finish_time sebelumnya agar jadwal siklus tetap efisien
            if (!updatedFinishTime) {
                updatedFinishTime = now;
            }
        }

        // 3. Tentukan Jadwal Pengecekan Berikutnya (Next Check Schedule)
        let nextCheckTime;
        if (cooldownCount > 0) {
            // Sisa cooldown -> Jadwalkan Re-check +1 Jam lagi
            nextCheckTime = now + (1 * 60 * 60 * 1000); 
        } else {
            // Semua tile bersih -> Jadwalkan Cooldown Penuh 24 Jam
            nextCheckTime = now + (24 * 60 * 60 * 1000); 
        }

        const updatedPayload = {
            total_ss: tiles.length,
            harvested_count: (currentWorldData.harvested_count || 0) + harvestedCount,
            cooldown_count: cooldownCount,
            ready_count: totalReadyCount,
            finish_time: updatedFinishTime, 
            last_check_time: now,
            next_check_time: nextCheckTime,
            tiles_status: tiles.map(t => ({
                x: t.x,
                y: t.y,
                status: t.isPunched ? "HARVESTED" : (t.isReady ? "READY" : "COOLDOWN")
            }))
        };

        await fetch(`${DB_URL}/worlds/${worldName}.json`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedPayload)
        });

        return updatedPayload;
    }

    // --- 4. MANAJEMEN WORLD & RENDER ---
    async function addWorld() {
        const nameInput = document.getElementById("input-world-name");
        const doorInput = document.getElementById("input-world-door");

        const worldName = nameInput.value.trim().toUpperCase();
        const doorId = doorInput.value.trim().toUpperCase() || "MAIN";

        if (!worldName) return alert("Masukkan nama world!");

        await fetch(`${DB_URL}/worlds/${worldName}.json`, {
            method: "SET",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                door: doorId,
                total_ss: 0,
                harvested_count: 0,
                cooldown_count: 0,
                ready_count: 0,
                created_at: Date.now()
            })
        });

        nameInput.value = "";
        doorInput.value = "";
        loadWorlds();
    }

    async function loadWorlds() {
        try {
            const res = await fetch(`${DB_URL}/worlds.json`);
            const data = await res.json() || {};
            const container = document.getElementById("world-list");
            container.innerHTML = "";

            let globalTotalSS = 0;
            let globalHarvested = 0;
            let globalCooldown = 0;
            let pendingRechecks = 0;

            const worldKeys = Object.keys(data);

            if (worldKeys.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem;">Belum ada farm world yang didaftarkan.</div>`;
            }

            for (const worldName of worldKeys) {
                const world = data[worldName];

                const totalSS = world.total_ss || 0;
                const harvested = world.harvested_count || 0;
                const cooldown = world.cooldown_count || 0;

                globalTotalSS += totalSS;
                globalHarvested += harvested;
                globalCooldown += cooldown;

                // Hitung Jadwal Re-Check +1 Jam
                const now = Date.now();
                const hasCooldown = cooldown > 0;
                let recheckBadgeHtml = "";

                if (hasCooldown) {
                    pendingRechecks++;
                    const diffMs = (world.next_check_time || 0) - now;
                    if (diffMs > 0) {
                        const diffMins = Math.floor(diffMs / 60000);
                        recheckBadgeHtml = `<span class="badge badge-warning">⏳ Re-check ${diffMins} mnt lagi</span>`;
                    } else {
                        recheckBadgeHtml = `<span class="badge badge-warning">⚠️ Siap Di-check Sekarang</span>`;
                    }
                } else {
                    recheckBadgeHtml = `<span class="badge badge-success">✓ Panen Selesai</span>`;
                }

                // Render Visual Tile Grid
                let tileGridHtml = "";
                if (world.tiles_status && Array.isArray(world.tiles_status) && world.tiles_status.length > 0) {
                    tileGridHtml = `
                        <div class="tile-container">
                            <div class="tile-label">Peta Tile SS World (Hover untuk Detail):</div>
                            <div class="tile-grid">` + 
                                world.tiles_status.map(t => {
                                    let tileClass = "tile-ready";
                                    if (t.status === "HARVESTED") tileClass = "tile-harvested";
                                    if (t.status === "COOLDOWN") tileClass = "tile-cooldown";
                                    return `<div class="tile ${tileClass}" title="Posisi (${t.x}, ${t.y}) — Status: ${t.status}"></div>`;
                                }).join('') + 
                            `</div>
                        </div>`;
                }

                // Format Waktu Selesai Panen
                const finishTimeFormatted = world.finish_time 
                    ? new Date(world.finish_time).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    : '-';

                container.innerHTML += `
                    <div class="world-card">
                        <div class="world-header">
                            <div>
                                <span class="world-title">${worldName}</span>
                                <span class="badge badge-secondary" style="margin-left: 6px;">Door: ${world.door || 'MAIN'}</span>
                            </div>
                            <div>
                                ${recheckBadgeHtml}
                                <button class="delete-btn" style="margin-left:8px;" onclick="deleteWorld('${worldName}')" title="Hapus World">✕</button>
                            </div>
                        </div>

                        <div class="world-stats-grid">
                            <div class="world-stat-item">Total SS <div>${totalSS}</div></div>
                            <div class="world-stat-item">Dipanen <div><span style="color:var(--success)">${harvested}</span></div></div>
                            <div class="world-stat-item">Cooldown <div><span style="color:var(--warning)">${cooldown}</span></div></div>
                            <div class="world-stat-item">Selesai Panen <div>${finishTimeFormatted}</div></div>
                        </div>

                        ${tileGridHtml}
                    </div>
                `;
            }

            // Update Stat Strip Global
            document.getElementById("stat-total-ss").innerText = globalTotalSS;
            document.getElementById("stat-harvested").innerText = globalHarvested;
            document.getElementById("stat-cooldown").innerText = globalCooldown;
            document.getElementById("stat-recheck-status").innerText = pendingRechecks > 0 ? `${pendingRechecks} World Re-Check` : "Semua Bersih";

        } catch (e) {
            console.error("Gagal memuat data world", e);
        }
    }

    async function deleteWorld(worldName) {
        if (confirm(`Hapus world ${worldName} dari daftar monitor?`)) {
            await fetch(`${DB_URL}/worlds/${worldName}.json`, { method: "DELETE" });
            loadWorlds();
        }
    }

    async function resetAllData() {
        if (confirm("Reset statistik panen untuk semua world? (Nama world dan Door tetap tersimpan)")) {
            const res = await fetch(`${DB_URL}/worlds.json`);
            const data = await res.json() || {};
            for (const worldName of Object.keys(data)) {
                await fetch(`${DB_URL}/worlds/${worldName}.json`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        harvested_count: 0,
                        cooldown_count: 0,
                        ready_count: 0,
                        finish_time: null,
                        next_check_time: null,
                        tiles_status: []
                    })
                });
            }
            loadWorlds();
        }
    }
</script>
