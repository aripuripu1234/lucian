<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucifer — Bot Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E2117;
    --bg-card: #15301F;
    --bg-card-hover: #1B3A26;
    --bg-input: #0F241A;
    --border: #2A4934;
    --border-soft: #223d2c;
    --gold: #E7B24C;
    --gold-dim: #a9832f;
    --coral: #E2643A;
    --sage: #8FA695;
    --text: #EDEAE0;
    --text-dim: #A9BAAE;
    --green-on: #6FBF7A;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, #17371F 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header{
    padding: 40px 5vw 24px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border-soft);
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .brand .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--gold);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 42px);
    margin: 0;
    line-height: 1.05;
  }

  .conn-status{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 999px;
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(143,166,149,0.15);
  }

  .dot.live{
    background: var(--green-on);
    box-shadow: 0 0 0 3px rgba(111,191,122,0.2);
  }

  main{
    padding: 32px 5vw 80px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .empty{
    grid-column: 1 / -1;
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 48px 24px;
    text-align:center;
    color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height:1.7;
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap: 16px;
    transition: border-color .15s ease, background .15s ease;
  }

  .card:hover{
    border-color: var(--gold-dim);
  }

  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 10px;
  }

  .growid{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    word-break: break-word;
  }

  .world-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 0.03em;
    margin-top: 4px;
  }

  .status-pill{
    display:flex;
    align-items:center;
    gap: 6px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    padding-top: 3px;
  }

  .readout{
    display:flex;
    gap: 20px;
    padding: 12px 0;
    border-top: 1px solid var(--border-soft);
    border-bottom: 1px solid var(--border-soft);
  }

  .readout .field{
    display:flex;
    flex-direction:column;
    gap: 2px;
  }

  .readout label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--sage);
    letter-spacing: 0.06em;
  }

  .readout .value{
    font-family:'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 500;
  }

  .last-seen{
    margin-left:auto;
    align-self:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .section{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }

  .section-label{
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .row{
    display:flex;
    gap: 8px;
  }

  input{
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    min-width: 0;
  }

  input:focus{
    outline: none;
    border-color: var(--gold-dim);
  }

  input.world-input{ flex: 2; }
  input.door-input{ flex: 1; }
  input.coord-input{ flex: 1; }

  button{
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: filter .12s ease, transform .05s ease;
  }

  button:active{ transform: translateY(1px); }

  .btn-warp{
    background: var(--gold);
    color: #23180A;
  }

  .btn-move{
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
  }

  button:hover{ filter: brightness(1.08); }
  button:disabled{ opacity: 0.5; cursor: default; filter:none; }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--gold-dim);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 999px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    opacity: 0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
  }

  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }

  .config-note{
    max-width: 480px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
  }

  .config-note code{
    font-family:'IBM Plex Mono', monospace;
    background: var(--bg-input);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--sage);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow">LUCIFER FLEET CONTROL</span>
    <h1>Bot Dashboard</h1>
  </div>
  <div class="conn-status">
    <span class="dot" id="connDot"></span>
    <span id="connText">Menghubungkan…</span>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty">Belum ada bot yang terhubung.<br/>Jalankan <code style="font-family:'IBM Plex Mono',monospace">dashboard_sync.lua</code> di script bot kamu untuk mulai mengirim data.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const DB_URL = "https://luci-44c7f-default-rtdb.asia-southeast1.firebasedatabase.app";
  const POLL_INTERVAL = 2000;

  const grid = document.getElementById('grid');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const toastEl = document.getElementById('toast');

  const cardEls = new Map(); // growid -> { root, els }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function timeAgo(ms){
    if(!ms) return '—';
    const diff = Math.max(0, Date.now() - ms);
    const s = Math.floor(diff/1000);
    if(s < 5) return 'baru saja';
    if(s < 60) return s + ' detik lalu';
    const m = Math.floor(s/60);
    if(m < 60) return m + ' menit lalu';
    const h = Math.floor(m/60);
    return h + ' jam lalu';
  }

  function statusLabel(code){
    // Cocok dengan urutan enum BotStatus di enums.md
    const names = [
      'offline','online','wrong_password','account_banned','location_banned',
      'version_update','advanced_account_protection','server_overload',
      'too_many_login','maintenance','server_busy','guest_limit','http_block',
      'bad_name_length','invalid_account','error_connecting','logon_fail',
      'captcha_requested','mod_entered','high_load'
    ];
    return names[code] || 'unknown';
  }

  async function sendCommand(growid, payload, btn){
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Mengirim…';
    try{
      const res = await fetch(`${DB_URL}/bots/${encodeURIComponent(growid)}/command.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      showToast(payload.action === 'warp'
        ? `Perintah warp dikirim ke ${growid}`
        : `Perintah pindah posisi dikirim ke ${growid}`);
    }catch(err){
      showToast('Gagal mengirim perintah: ' + err.message);
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  function buildCard(growid){
    const root = document.createElement('div');
    root.className = 'card';
    root.innerHTML = `
      <div class="card-head">
        <div>
          <p class="growid"></p>
          <div class="world-badge"></div>
        </div>
        <div class="status-pill"><span class="dot"></span><span class="status-text"></span></div>
      </div>

      <div class="readout">
        <div class="field"><label>X</label><span class="value x-val">—</span></div>
        <div class="field"><label>Y</label><span class="value y-val">—</span></div>
        <span class="last-seen"></span>
      </div>

      <div class="section">
        <div class="section-label">Warp ke world</div>
        <div class="row">
          <input class="world-input" type="text" placeholder="nama world" />
          <input class="door-input" type="text" placeholder="door id" />
          <button class="btn-warp">Warp</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Gerakkan ke titik (tile)</div>
        <div class="row">
          <input class="coord-input" type="number" placeholder="x" />
          <input class="coord-input" type="number" placeholder="y" />
          <button class="btn-move">Gerakkan</button>
        </div>
      </div>
    `;

    const els = {
      growid: root.querySelector('.growid'),
      world: root.querySelector('.world-badge'),
      statusDot: root.querySelector('.status-pill .dot'),
      statusText: root.querySelector('.status-text'),
      x: root.querySelector('.x-val'),
      y: root.querySelector('.y-val'),
      lastSeen: root.querySelector('.last-seen'),
      worldInput: root.querySelector('.world-input'),
      doorInput: root.querySelector('.door-input'),
      xInput: root.querySelectorAll('.coord-input')[0],
      yInput: root.querySelectorAll('.coord-input')[1],
      warpBtn: root.querySelector('.btn-warp'),
      moveBtn: root.querySelector('.btn-move'),
    };

    els.warpBtn.addEventListener('click', () => {
      const world = els.worldInput.value.trim();
      const door_id = els.doorInput.value.trim();
      if(!world){ showToast('Isi nama world dulu.'); return; }
      sendCommand(growid, { action: 'warp', world, door_id, ts: Date.now() }, els.warpBtn);
    });

    els.moveBtn.addEventListener('click', () => {
      const x = parseInt(els.xInput.value, 10);
      const y = parseInt(els.yInput.value, 10);
      if(Number.isNaN(x) || Number.isNaN(y)){ showToast('Isi x dan y dulu.'); return; }
      sendCommand(growid, { action: 'move', x, y, ts: Date.now() }, els.moveBtn);
    });

    grid.appendChild(root);
    return { root, els };
  }

  function renderBots(data){
    const growids = data ? Object.keys(data) : [];

    // Hapus kartu untuk bot yang sudah tidak ada.
    for(const [growid, entry] of cardEls){
      if(!growids.includes(growid)){
        entry.root.remove();
        cardEls.delete(growid);
      }
    }

    // Toggle empty state
    const emptyEl = grid.querySelector('.empty');
    if(growids.length === 0){
      if(!emptyEl){
        grid.innerHTML = `<div class="empty">Belum ada bot yang terhubung.<br/>Jalankan <code style="font-family:'IBM Plex Mono',monospace">dashboard_sync.lua</code> di script bot kamu untuk mulai mengirim data.</div>`;
      }
      return;
    }else if(emptyEl){
      emptyEl.remove();
    }

    for(const growid of growids){
      const bot = data[growid] || {};
      let entry = cardEls.get(growid);
      if(!entry){
        entry = buildCard(growid);
        cardEls.set(growid, entry);
      }

      const { els } = entry;
      els.growid.textContent = growid;
      els.world.textContent = bot.world ? `📍 ${bot.world}` : 'belum masuk world';
      els.x.textContent = (bot.x ?? '—');
      els.y.textContent = (bot.y ?? '—');
      els.lastSeen.textContent = timeAgo(bot.last_seen);

      const online = bot.status === 1; // BotStatus.online
      els.statusDot.style.background = online ? 'var(--green-on)' : 'var(--coral)';
      els.statusText.textContent = statusLabel(bot.status);
    }
  }

  async function poll(){
    try{
      const res = await fetch(`${DB_URL}/bots.json`, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderBots(data);
      connDot.classList.add('live');
      connText.textContent = 'Terhubung ke Firebase';
    }catch(err){
      connDot.classList.remove('live');
      connText.textContent = 'Gagal konek: ' + err.message;
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL);
</script>

</body>
</html>
